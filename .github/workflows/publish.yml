name: Publish to npm

# Publishes @ambystech/ambykit to npm when a GitHub Release is published (or run manually).
# Auth is via npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN. Configure the trusted
# publisher on npmjs.com (package → Settings → Trusted Publisher → GitHub Actions: this repo +
# workflow "publish.yml") before this can succeed.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    # Plugin releases (tag plugin/<name>/vX.Y.Z) are published by publish-plugins.yml, not by this workflow.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'plugin/')
    runs-on: ubuntu-latest
    # Must match the "Environment" set on the npm trusted publisher (case-sensitive).
    environment: Prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, newer than what ships with Node 22.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # Fail fast if a release tag (vX.Y.Z) doesn't match package.json — avoids publishing a stale version.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A prerelease (2.0.0-rc.1) goes to the `next` dist-tag, a plain version to `latest` (034:FR-009). npm refuses a prerelease
      # without an explicit tag, so the tag is always passed.
      - name: Choose the npm dist-tag
        id: disttag
        run: echo "tag=$(node scripts/release-tag.mjs)" >> "$GITHUB_OUTPUT"

      # A final 2.0.x version publishes only when every gate condition in specs/034-release-2-0/gate.md is met and the
      # preconditions hold (034:FR-004). Any other version (a candidate, a 1.x patch) passes straight through.
      - name: Release gate
        run: node scripts/release-gate.mjs

      # The same version can reach this workflow twice — e.g. a manual dispatch publishes it, then
      # the GitHub Release for that version fires `release: published`. npm rejects the second
      # attempt (EPUBLISHCONFLICT), so detect it and skip rather than fail the release.
      - name: Check whether this version is already on npm
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$PKG@$VER" version 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$VER is already published — skipping the publish step."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing: npm uses the id-token (OIDC) — no NODE_AUTH_TOKEN. Provenance is automatic.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
